<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>C++ Dice Roller</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #4f4f97;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .dice-container {
            perspective: 600px;
            margin: 40px;
        }
        .die {
            width: 120px;
            height: 120px;
            background: #ffffff;
            color: #cdd247;
            font-size: 64px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(119, 17, 17, 0.5);
            transition: transform 0.5s ease;
        }
        .rolling {
            animation: shake 0.4s infinite;
        }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-3px, 0px) rotate(5deg); }
            40% { transform: translate(1px, -1px) rotate(-5deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(3deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        button {
            background: #ff4757;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 71, 87, 0.4);
            transition: background 0.2s;
        }
        button:hover {
            background: #ff6b81;
        }
    </style>
</head>
<body>

    <h1>C++ Powered Dice Game</h1>
    <div class="dice-container">
        <div id="die" class="die">?</div>
    </div>
    <button onclick="rollDice()">Roll Dice</button>

    <script>
        function rollDice() {
            const die = document.getElementById('die');
            die.classList.add('rolling');
            
            // Simulates rolling delay and fetches/generates a random face
            setTimeout(() => {
                // In a local web environment, you can fetch from a local C++ backend API 
                // or use a secure JS random fallback mimicking the C++ generator:
                const randomVal = Math.floor(Math.random() * 6) + 1;
                
                die.classList.remove('rolling');
                die.innerText = randomVal;
            }, 500);
        }
    </script>
</body>
</html>
